# SPDX-License-Identifier: GPL-2.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the scripts promise (docs/CONTRACTS.md invariant 1): operators run
        # these on unknown machines, often the same older hosting we are auditing. Testing the
        # floor and a current release catches accidental use of newer syntax.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile every script
        run: |
          shopt -s globstar nullglob
          files=(skills/**/*.py evals/**/*.py tools/**/*.py)
          if [ ${#files[@]} -eq 0 ]; then echo "no python files yet"; exit 0; fi
          printf '%s\n' "${files[@]}"
          python -m py_compile "${files[@]}"

      - name: Assert standard library only
        # No requirements.txt, no setup.py, no pyproject with dependencies. If one of these
        # appears, the stdlib-only guarantee has been broken and operators can no longer run
        # these scripts on an arbitrary machine.
        run: |
          for f in requirements.txt setup.py Pipfile poetry.lock; do
            if [ -e "$f" ]; then echo "FAIL: $f present; scripts must be stdlib-only"; exit 1; fi
          done
          echo "OK: no dependency manifests present"

      - name: No third-party egress
        run: python tools/check_no_egress.py

      - name: Skill docs — links, reference depth, time-sensitive claims
        run: python tools/check_skill_docs.py

      - name: Plugin manifests match the documented install command
        run: python tools/check_plugin_manifest.py

      - name: Change-plan validator self-test
        # The fix skill's gate is a safety device. If its own refusals stop working, every other
        # guarantee in wp-perf-fix rests on nothing.
        run: python skills/wp-perf-fix/scripts/validate_plan.py --selftest

      - name: Report checker self-test
        # Same reasoning as the change-plan validator: the report contract is only worth as much
        # as the refusals behind it. A checker that silently stops rejecting an invented rating
        # is worse than none, because the reports keep passing.
        run: python skills/wp-perf-audit/scripts/check_report.py --selftest

      - name: The shipped report template satisfies its own contract
        # Run through the tools/ shim so both entry points are exercised. --template tolerates
        # {{PLACEHOLDER}} cells while still enforcing sections, order and row presence, so the
        # template cannot drift from the contract it is supposed to embody.
        run: python tools/check_report.py --template skills/wp-perf-audit/references/findings-report-template.md

      - name: Shell scripts parse
        run: |
          shopt -s globstar nullglob
          for f in **/*.sh; do bash -n "$f" && echo "ok: $f"; done

  skill-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Conformance — official Agent Skills validator
        # The normative check, from the spec's own reference library. It enforces the frontmatter
        # rules and the name-matches-directory requirement that a hand-rolled check would drift
        # from as the spec evolves.
        run: |
          for d in skills/*/; do
            npx -y skills-ref@latest validate "./$d"
          done

      - name: SKILL.md body stays inside the context budget
        # The one rule the official validator does not enforce. The spec recommends keeping the
        # body under 500 lines because the whole file loads once the skill activates; past that,
        # detail belongs in references/ where it costs nothing until read.
        #
        # Frontmatter is deliberately NOT re-checked here. A hand-rolled copy of those rules
        # drifts from the spec, and this one already had: its regex swallowed the license and
        # compatibility fields into the description and reported 924 characters where the real
        # description was 706.
        run: |
          python - <<'PY'
          import re, sys, pathlib
          fails = []
          skills = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          for p in skills:
              text = p.read_text(encoding="utf-8")
              m = re.match(r"^---\n.*?\n---\n", text, re.S)
              if not m:
                  fails.append(f"{p}: missing YAML frontmatter"); continue
              n_lines = len(text[m.end():].splitlines())
              if n_lines > 500:
                  fails.append(f"{p}: body is {n_lines} lines; keep under 500 (split into references/)")
          for f in fails: print("FAIL:", f)
          print(f"checked {len(skills)} skill body/bodies")
          sys.exit(1 if fails else 0)
          PY
